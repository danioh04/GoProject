name: prism

services:
  server:
    build: .
    environment:
      ADDR: ":8080"
      LOG_LEVEL: info
      LOG_FORMAT: json
      DATABASE_URL: postgres://prism:prism@db:5432/prism?sslmode=disable
      GOOGLE_MAPS_API_KEY: "${GOOGLE_MAPS_API_KEY:-}"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: prism
      POSTGRES_PASSWORD: prism
      POSTGRES_DB: prism
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prism"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
