run:
  timeout: 5m

linters:
  disable-all: true
  enable:
    - govet
    - staticcheck
    - exhaustive
    - sqlclosecheck
    - rowserrcheck
    - errcheck
    - bodyclose
    - errorlint
    - gosec
    - noctx

linters-settings:
  exhaustive:
    default-signifies-exhaustive: true

  gosec:
    excludes:
      - G404
      - G108
